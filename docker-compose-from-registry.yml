# Data locations (state this explicitly -- it is easy to get wrong):
#   * The SQLite database is the named volume `db`, mounted at
#     /app/localca_project/db -- the Django project directory inside the image,
#     which is where settings.py puts it. Inspect or back it up with:
#       docker volume inspect <project>_db
#       docker run --rm -v <project>_db:/data -v "$PWD":/out alpine \
#         tar czf /out/localca-db-backup.tgz -C /data .
#     It is NOT in the source directory.
#   * Collected static files live in `static_volume` (regenerable, not backup
#     material). `web` mounts it at /app/localca_project/staticfiles because that
#     is STATIC_ROOT; nginx mounts the same volume at /app/staticfiles, which is
#     the path nginx.conf aliases. Only the mount point differs -- the content is
#     the same volume.
#   * Upgrading from the earlier image, which kept everything under /app? The
#     mount targets and the required environment changed; see
#     "Upgrading from an earlier version" in README.md.
services:
  web:
    image: practicalsre/local-ca:latest
    container_name: web
    restart: unless-stopped
    volumes:
      - db:/app/localca_project/db
      - static_volume:/app/localca_project/staticfiles
    environment:
      - TZ=UTC
      # Required: LocalCA refuses to start without a secret key.
      # Generate one with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(50))"
      # Put it in a .env file next to this compose file (see .env.example).
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      # Hostnames this deployment is served under (comma separated).
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      - DJANGO_DEBUG=false
      # Optional: the initial superuser's password. If unset, the first start
      # generates a random one and prints it once to the logs.
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1,http://localhost}
    networks:
      - app_network
    command: >
      sh -c "
        ls -l
        python manage.py migrate &&
        python manage.py initadmin &&
        python manage.py collectstatic --noinput &&
        exec gunicorn localca_project.wsgi --bind 0.0.0.0:8000 --worker-class=gthread --threads=4"
  nginx:
    image: practicalsre/local-ca-nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - app_network

volumes:
  static_volume:
  db:

networks:
  app_network:
    driver: bridge
