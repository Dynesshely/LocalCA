# Local build: builds both images from this checkout.
#
# Data locations, stated explicitly because they are easy to get wrong:
#   * The SQLite database is the bind mount ./db -> /app/localca_project/db --
#     the Django project directory inside the image, which is where settings.py
#     puts it. It lives in this directory on the host, which is what you must
#     back up. It is NOT in a named Docker volume.
#   * Collected static files live in the named volume static_volume.
#     `web` mounts it at /app/localca_project/staticfiles (STATIC_ROOT) and
#     nginx mounts the same volume at /app/staticfiles (the path nginx.conf
#     aliases). This is regenerable, not backup material.
#   * The image runs unprivileged, so ./db must be writable by APP_UID. Either
#     build with your own account's ids:
#         mkdir -p db
#         printf 'APP_UID=%s\nAPP_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
#     or hand the directory to the image's default user:
#         mkdir -p db && sudo chown 10001:10001 db
#   * Upgrading from the earlier image, which kept everything under /app? The
#     mount targets and the required environment changed; see
#     "Upgrading from an earlier version" in README.md.
services:
  web:
    build:
      context: .
      # Overridden from .env (see above). Changing these is what lets the
      # container write a database that already belongs to another account.
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    command: sh start.sh
    volumes:
      - ./db:/app/localca_project/db
      - static_volume:/app/localca_project/staticfiles
    environment:
      - TZ=UTC
      # Required: LocalCA refuses to start without a secret key.
      # Generate one with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(50))"
      # Put it in a .env file next to this compose file (see .env.example).
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      # Hostnames this deployment is served under (comma separated).
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      - DJANGO_DEBUG=false
      # Optional: the initial superuser's password. If unset, the first start
      # generates a random one and prints it once to the logs.
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1,http://localhost}

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    volumes:
      # Only the collected static files: nginx does not need the application
      # source, and mounting it here would let a compromised nginx write to it.
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  static_volume:
