# Nginx configuration for LocalCA
# This is the default configuration for standalone deployment
# For reverse proxy deployments (e.g., Traefik), see TRAEFIK_DEPLOYMENT.md

server {
    listen 80;

    # Certificate import uploads a bundle: up to 8 files, 1 MiB each and 5 MiB in
    # total, plus multipart overhead. Nginx's default cap is 1m, which would
    # answer 413 before the application ever sees the request.
    client_max_body_size 8m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }
}
