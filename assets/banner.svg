<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Local CA — your own internal certificate authority">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.55" stop-color="#0a142b"/>
      <stop offset="1" stop-color="#0c1b38"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accentX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1600" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="420" fill="url(#bg)"/>
    <rect width="1600" height="420" fill="url(#grid)" opacity="0.85"/>
    <circle cx="1260" cy="120" r="330" fill="url(#glowCyan)"/>
    <circle cx="240" cy="440" r="380" fill="url(#glowIndigo)"/>
    <rect x="0" y="0" width="1600" height="2" fill="url(#hairline)"/>
    <rect x="0" y="414" width="1600" height="6" fill="url(#accentX)" opacity="0.8"/>

    <!-- left accent rail -->
    <rect x="76" y="92" width="4" height="246" rx="2" fill="url(#accent)" filter="url(#softGlow)"/>

    <!-- left copy -->
    <text x="104" y="124" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="5.2" fill="#67e8f9">SELF-HOSTED CERTIFICATE AUTHORITY</text>
    <text x="100" y="220" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="96" font-weight="700" letter-spacing="-2" fill="url(#title)">Local CA</text>
    <text x="104" y="264" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#cbd5e1">Your own internal certificate authority</text>
    <text x="104" y="300" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#7c8aa5"><tspan>Root · Intermediate · Leaf</tspan><tspan fill="#3b4a63">   |   </tspan><tspan>TLS &amp; mTLS</tspan><tspan fill="#3b4a63">   |   </tspan><tspan>Keys encrypted at rest</tspan></text>

    <!-- chips -->
    <g font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
      <rect x="104" y="326" width="138" height="36" rx="18" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.20"/>
      <text x="173" y="349" text-anchor="middle">Django 5.2</text>
      <rect x="252" y="326" width="92" height="36" rx="18" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.20"/>
      <text x="298" y="349" text-anchor="middle">Vue 3</text>
      <rect x="354" y="326" width="100" height="36" rx="18" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.20"/>
      <text x="404" y="349" text-anchor="middle">Docker</text>
      <rect x="464" y="326" width="124" height="36" rx="18" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.20"/>
      <text x="526" y="349" text-anchor="middle">EN / 中文</text>
    </g>

    <!-- right: certificate hierarchy -->
    <g filter="url(#cardShadow)">
      <g>
        <rect x="1080" y="64" width="300" height="82" rx="14" fill="#0d172c" fill-opacity="0.86" stroke="#7dd3fc" stroke-opacity="0.22"/>
        <rect x="1080" y="76" width="4" height="58" rx="2" fill="url(#accent)"/>
        <path d="M1112 96 l14 5 v10 c0 9 -6 15 -14 19 c-8 -4 -14 -10 -14 -19 v-10 z" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M1106 111 l4 4 l7 -8" fill="none" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1148" y="100" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#67e8f9">ROOT CA</text>
        <text x="1148" y="127" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Homelab Root CA</text>
      </g>
      <g>
        <rect x="1120" y="169" width="300" height="82" rx="14" fill="#0d172c" fill-opacity="0.86" stroke="#7dd3fc" stroke-opacity="0.22"/>
        <rect x="1120" y="181" width="4" height="58" rx="2" fill="url(#accent)"/>
        <path d="M1142 206 l8 -8 a5.4 5.4 0 0 1 7.6 7.6 l-8 8" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M1159 197 l8 -8 a5.4 5.4 0 0 1 7.6 7.6 l-8 8" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round"/>
        <text x="1188" y="205" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#67e8f9">INTERMEDIATE CA</text>
        <text x="1188" y="232" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Services Intermediate</text>
      </g>
      <g>
        <rect x="1160" y="274" width="300" height="82" rx="14" fill="#0d172c" fill-opacity="0.86" stroke="#7dd3fc" stroke-opacity="0.22"/>
        <rect x="1160" y="286" width="4" height="58" rx="2" fill="url(#accent)"/>
        <path d="M1184 303 h20 v16 h-20 z" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M1189 303 v-6 a5 5 0 0 1 10 0 v6" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round"/>
        <text x="1228" y="310" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#67e8f9">LEAF CERTIFICATE</text>
        <text x="1228" y="337" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">grafana.home</text>
      </g>
    </g>

    <!-- connectors -->
    <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.55">
      <path d="M1230 146 L1270 169"/>
      <path d="M1270 251 L1310 274"/>
    </g>
    <circle cx="1230" cy="146" r="3.5" fill="#67e8f9"/>
    <circle cx="1270" cy="251" r="3.5" fill="#a5b4fc"/>
    <circle cx="1310" cy="274" r="3.5" fill="#c4b5fd"/>

    <!-- orbit accents -->
    <circle cx="1280" cy="210" r="238" fill="none" stroke="#60a5fa" stroke-opacity="0.10"/>
    <circle cx="1280" cy="210" r="204" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-dasharray="2 9"/>

    <text x="1524" y="392" text-anchor="end" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#475569">github.com/Dynesshely/LocalCA</text>
  </g>
</svg>
