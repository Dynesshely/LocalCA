# ---------------------------------------------------------------------------
# LocalCA — deployment on an internal server, running the published image.
#
# Everything is here: nginx is stock nginx:alpine with its configuration supplied
# inline below, so this single file plus an .env is all the server needs.
#
#   cd /srv/localca                      # wherever you keep it
#   cat > .env <<'EOF'
#   DJANGO_SECRET_KEY=<paste: python3 -c "import secrets;print(secrets.token_urlsafe(50))">
#   DJANGO_ALLOWED_HOSTS=localca.lan,192.168.1.10,localhost,127.0.0.1
#   CSRF_TRUSTED_ORIGINS=http://localca.lan,http://192.168.1.10
#   # The published image to run, e.g. <registry>/<project>/local-ca. Kept in .env
#   # rather than here so this file names no particular registry.
#   LOCALCA_IMAGE=<registry>/<project>/local-ca
#   # LOCALCA_TAG=latest
#   # Optional, only used when the database is still empty:
#   # DJANGO_SUPERUSER_PASSWORD=<the password you want for `admin`>
#   # TZ=Asia/Shanghai
#   # HTTP_PORT=80
#   EOF
#
#   docker login <your registry>
#   docker compose -f docker-compose-harbor.yml up -d
#   → http://<server>/            (sign in as `admin`)
#
# Upgrade to a newer build:
#   docker compose -f docker-compose-harbor.yml pull
#   docker compose -f docker-compose-harbor.yml up -d
#
# Back up the database (the named volume `localca_db` is the only state):
#   docker run --rm -v localca_db:/data -v "$PWD":/out alpine \
#     tar czf /out/localca-db-$(date +%F).tgz -C /data .
#
# Do not expose this to the internet: it issues the certificates your internal
# services trust.
#
# The inline `configs:` block below needs Docker Compose 2.23 or newer. On an
# older server, drop the configs block, put the same server{} into ./nginx.conf
# (the repository has it) and replace it with
#   volumes: [ "./nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
# ---------------------------------------------------------------------------
services:
  web:
    image: ${LOCALCA_IMAGE:?set LOCALCA_IMAGE (the published image) in .env}:${LOCALCA_TAG:-latest}
    container_name: localca-web
    restart: unless-stopped
    volumes:
      # settings.py keeps SQLite at BASE_DIR/db, i.e. inside the project
      # directory. This volume is what you back up.
      - localca_db:/app/localca_project/db
      # collectstatic writes here on every start; nginx serves the same volume.
      - localca_static:/app/localca_project/staticfiles
    environment:
      - TZ=${TZ:-UTC}
      # Both are required: the application refuses to start without a secret key,
      # and with DEBUG off it validates the Host header.
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS in .env}
      - DJANGO_DEBUG=false
      # Only read when the database has no superuser yet. If you leave it empty a
      # random password is generated and printed once in the logs.
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1,http://localhost}
      # Behind a reverse proxy with a path prefix (e.g. https://host/localca),
      # set URL_PREFIX and have the proxy strip it before forwarding.
      # - URL_PREFIX=/localca
      # Once the site is served over HTTPS, turn these on:
      # - DJANGO_SECURE_COOKIES=true
    networks:
      - localca

  nginx:
    image: nginx:alpine
    container_name: localca-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    configs:
      - source: localca_nginx
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - localca_static:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - localca

volumes:
  # Explicit names, so the backup command above keeps working even if this file
  # is moved or the compose project is renamed.
  localca_db:
    name: localca_db
  localca_static:
    name: localca_static

configs:
  localca_nginx:
    content: |
      server {
          listen 80;
          server_name _;

          # Certificate import uploads a bundle of up to 8 files, 1 MiB each and
          # 5 MiB in total; nginx's default 1m would answer 413 first.
          client_max_body_size 8m;

          location /static/ {
              alias /app/staticfiles/;
              expires 30d;
          }

          location / {
              proxy_pass http://web:8000;
              # $$ so compose leaves them for nginx: a single $ would be
              # interpolated by compose and silently expand to nothing.
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }

networks:
  localca:
