name: Django CI
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
      # Supplies a throwaway SECRET_KEY and enables DEBUG for the test
      # run only. Never set this for a deployment.
      DJANGO_TESTING: "true"
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Runtime plus dev tooling: the test suite itself needs only runtime
        # dependencies, but installing the same set as CI pylint keeps the
        # two jobs consistent.
        pip install -r requirements-dev.txt
    - name: Run Custom Tests
      run: |
        python localca_project/manage.py test
